version: '3.8'

services:
  setu-pg:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: setu-pg
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_dev_only
      POSTGRES_DB: setu
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  setu-minio:
    image: quay.io/minio/minio
    container_name: setu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: setu
      MINIO_ROOT_PASSWORD: setu_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /Users/meghvyas/setu-minio-data:/data
    restart: unless-stopped

  setu-ml-worker:
    build: .
    container_name: setu-ml-worker
    env_file: .env
    environment:
      # Override the local DB and MinIO endpoints from .env to use Docker DNS
      DATABASE_URL: postgresql://setu:setu_dev_only@setu-pg:5432/setu
      MINIO_ENDPOINT: setu-minio:9000
    depends_on:
      - setu-pg
      - setu-minio
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
