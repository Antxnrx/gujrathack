[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu-ml"
version = "0.1.0"
description = "Setu — AI inference pipeline for cross-camera vehicle tracking and NL search"
requires-python = ">=3.11"
dependencies = [
  # Computer vision + AI
  "ultralytics>=8.3",          # YOLOv8 + ByteTrack (tracker built-in)
  "lap>=0.5.12",               # Linear assignment (required by BYTETracker — ultralytics dep)
  "open-clip-torch>=2.24",     # CLIP ViT-B/32 visual + text embeddings
  "torch>=2.3",                # PyTorch (CUDA build installed separately, see README)
  "torchvision>=0.18",
  "opencv-python-headless>=4.10",
  "Pillow>=10.4",
  "fast-plate-ocr>=0.3",       # Lightweight ANPR OCR (primary)
  "onnxruntime>=1.16",         # Required by fast-plate-ocr
  # Undeclared but required: the FarAwayFer plate-detector checkpoint is pickled
  # with an OmegaConf config object, so torch.load raises ModuleNotFoundError
  # without it. DetectionPipeline.__init__ loads the plate detector eagerly, so
  # a missing omegaconf takes down the whole pipeline, not just ANPR.
  "omegaconf==2.3.1",
  # Database
  "psycopg2-binary>=2.9",      # PostgreSQL driver
  "pgvector>=0.3",             # pgvector type adapter for psycopg2
  # Object storage
  "minio>=7.2",                # MinIO / S3-compatible thumbnail storage
  # Config + HTTP
  "pydantic-settings>=2.4",
  "pydantic>=2.9",
  "requests>=2.32",            # Sentinel cookie auth + HLS segment download
]

[project.optional-dependencies]
# The operator API. Kept out of the core dependency set on purpose: ml/worker.py
# and scripts/* run on edge boxes that never serve HTTP, and pulling a web stack
# onto them would be dead weight. Pinned exactly — this is the layer an operator
# authenticates against, so a surprise minor upgrade of the JWT or ASGI stack is
# not something to discover in a demo.
backend = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "asyncpg==0.31.0",           # async pool for the API; ml/* keeps psycopg2
  "PyJWT[crypto]==2.13.0",     # RS256 verification against Model 1's JWKS
]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
setu-worker = "ml.worker:main"
setu-check  = "ml.scripts.check_feeds:main"
setu-index  = "scripts.batch_index:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
